version: '3.8'

services:
  luxora:
    build: .
    container_name: luxora-salon
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: your-super-secret-change-this
      DATABASE_URL: file:/app/data/prod.db
      CORS_ORIGIN: "*"
    volumes:
      - luxora-db:/app/data
    restart: unless-stopped

volumes:
  luxora-db: